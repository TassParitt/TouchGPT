name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:cloudflare
      - run: npm run check:pages
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())') npm run test:e2e
